<!DOCTYPE html>
<html>

<head>
    <title>E-commerce</title>
</head>

<body>
    <div class="js-container"></div>

    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>

    <script src="https://unpkg.com/supersimpledev/babel.js"></script>
    <script type="text/babel">

        function ProductDetails({ name, price, imgSrc }) {

            return (
                <div>
                    <img src={imgSrc} width="50"></img>
                    <p> {name}  </p>
                    <p> Price: ${price} </p>
                    <button>Add to cart </button>
                </div>
            )

        }

        function App() {
            return (
                <>
                    <ProductDetails name="Cotton Socks" price="10.90" imgSrc="cotton-socks.png" />
                    <ProductDetails name="Tennis ball" price="7.00" imgSrc="tennis-balls.png" />
                    <ProductDetails name="T shirt" price="10.90" imgSrc="plain-t-shirt.png" />
                </>
            )
        }
        const container = document.querySelector('.js-container');
        ReactDOM.createRoot(container).render(<App />);
    </script>
</body>

</html>
